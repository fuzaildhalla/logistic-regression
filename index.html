<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Pass / Fail Predictor</title>
  <style>
    :root {
      --navy: #071B2B;
      --navy-card: #0D273D;
      --teal: #167D8D;
      --teal-hover: #1C96A8;
      --ice: #B9E4E8;
      --light: #EEEEEE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 15%, rgba(22, 125, 141, 0.28), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(185, 228, 232, 0.14), transparent 45%),
        var(--navy);
      color: var(--light);
      padding: 20px;
    }

    .card {
      background: var(--navy-card);
      border: 1px solid rgba(185, 228, 232, 0.25);
      border-radius: 16px;
      box-shadow: 0 22px 45px -15px rgba(2, 10, 18, 0.8);
      width: 100%;
      max-width: 440px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--teal), var(--ice), var(--light));
    }

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--light);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--ice);
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ice);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="number"] {
      width: 100%;
      background: var(--navy);
      border: 1px solid rgba(185, 228, 232, 0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--light);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="number"]::placeholder {
      color: rgba(185, 228, 232, 0.45);
    }

    input[type="number"]:focus {
      border-color: var(--ice);
      box-shadow: 0 0 0 3px rgba(22, 125, 141, 0.35);
    }

    .helper-text {
      font-size: 0.75rem;
      color: var(--ice);
      opacity: 0.75;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 0.98rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--teal), #126572);
      color: var(--light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(22, 125, 141, 0.35);
    }

    button:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--teal-hover), var(--teal));
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(22, 125, 141, 0.45);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(185, 228, 232, 0.35);
      border-top-color: var(--light);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-card {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: var(--navy);
      border: 1px solid rgba(185, 228, 232, 0.28);
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    .result-label {
      font-size: 0.875rem;
      color: var(--ice);
    }

    .badge {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge.pass {
      color: var(--navy);
      background: var(--ice);
      border: 1px solid var(--light);
    }

    .badge.fail {
      color: var(--light);
      background: rgba(239, 68, 68, 0.22);
      border: 1px solid rgba(248, 113, 113, 0.55);
    }

    .prob-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--light);
    }

    .error-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.45);
      color: var(--light);
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>Student Pass / Fail</h1>
      <p>Enter study hours to predict the outcome</p>
    </div>

    <form id="predictForm">
      <div class="form-group">
        <label for="studyHours">Daily Study Hours</label>
        <div class="input-wrapper">
          <input type="number" id="studyHours" name="studyHours" min="0" max="24" step="0.5" value="5.0"
            placeholder="e.g. 5.5" required>
        </div>
        <p class="helper-text">Allowed range: 0.0 to 24.0 hours</p>
      </div>

      <button type="submit" id="predictBtn">
        <span class="spinner" id="btnSpinner"></span>
        <span id="btnText">Predict Result</span>
      </button>
    </form>

    <div class="error-box" id="errorBox"></div>

    <div class="result-card" id="resultCard">
      <div class="result-row">
        <span class="result-label">Predicted Outcome</span>
        <span class="badge" id="predictionBadge">Pass</span>
      </div>
      <div class="result-row">
        <span class="result-label">Pass Probability</span>
        <span class="prob-value" id="probabilityText">0%</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const input = document.getElementById('studyHours');
    const btn = document.getElementById('predictBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const resultCard = document.getElementById('resultCard');
    const badge = document.getElementById('predictionBadge');
    const probText = document.getElementById('probabilityText');
    const errorBox = document.getElementById('errorBox');

    function setLoading(isLoading) {
      btn.disabled = isLoading;
      if (isLoading) {
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Predicting...';
      } else {
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Predict Result';
      }
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      resultCard.style.display = 'none';
    }

    function hideError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const hours = parseFloat(input.value);
      if (isNaN(hours) || hours < 0 || hours > 24) {
        showError('Please enter valid study hours between 0 and 24.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ StudyHours: hours })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.detail
            ? (Array.isArray(errData.detail) ? errData.detail[0].msg : errData.detail)
            : `Request failed with status ${response.status}`;
          throw new Error(errMsg);
        }

        const data = await response.json();

        const isPass = (data.prediction === 'Pass' || data.prediction === 1);
        badge.textContent = isPass ? 'Pass' : 'Fail';
        badge.className = `badge ${isPass ? 'pass' : 'fail'}`;

        const prob = Math.round(Number(data.pass_probability) * 100);
        probText.textContent = `${prob}%`;

        resultCard.style.display = 'block';
      } catch (err) {
        showError(err.message || 'An unexpected error occurred while predicting.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
