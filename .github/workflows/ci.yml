name: FastAPI ML Model CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Verify model and API endpoints
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)

          r1 = client.get('/')
          assert r1.status_code == 200, f'Health check failed: {r1.text}'

          r2 = client.post('/predict', json={'StudyHours': 6.0})
          assert r2.status_code == 200, f'Predict failed: {r2.text}'
          print('API Test Passed:', r2.json())
          "

      - name: Trigger Render Deploy Hook
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -X POST "$HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping hook (Render auto-deploy on git push is active)."
          fi
